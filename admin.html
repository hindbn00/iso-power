<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administration – ISO POWER</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<section id="login" class="lg-wrap" hidden>
  <form id="lf" class="lg-box">
    <img src="assets/logo.png" alt="ISO POWER">
    <h1>Administration</h1>
    <p id="lmsg" class="err" role="alert" hidden></p>
    <label>E-mail<input name="e" type="email" autocomplete="username" required></label>
    <label>Mot de passe<input name="p" type="password" autocomplete="current-password" required></label>
    <button class="btn pri">Se connecter</button>
  </form>
</section>

<div id="shell" hidden>
  <aside id="side">
    <a class="brand" href="admin"><img src="assets/logo.png" alt="ISO POWER"></a>
    <nav id="tabs">
      <a href="#stats" data-v="stats">Statistiques</a>
      <a href="#orders" data-v="orders">Commandes <b id="bo" hidden></b></a>
      <a href="#quotes" data-v="quotes">Devis <b id="bq" hidden></b></a>
      <a href="#products" data-v="products">Produits</a>
    </nav>
    <div class="foot">
      <a href="/" target="_blank" rel="noopener">Voir la boutique</a>
      <button id="out" class="lnk">Se déconnecter</button>
    </div>
  </aside>
  <main><div id="view"></div></main>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="supa.js"></script>
<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
